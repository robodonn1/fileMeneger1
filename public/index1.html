<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все файлы</title>

    <style>
        body{
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        a{
            font-size: 48px;
        }

        .files{
            display: flex;
            flex-direction: column;
            gap: 30px   ;
        }

        .file{
            display: flex;
            align-items: center;
            gap: 30px   ;
            padding: 10px 20px;
            background-color: rgb(214, 236, 233);
            border-radius: 16px;
        }

        .file a{
            font-size: 24px;
            border-radius: 16px;
            padding: 10px 20px;
            background-color: black;
            color: white;
            transition: 0.2s all;
        }

        .file a:hover{
            background-color: rgb(66, 65, 65);
        }

        .file a:active{
            background-color: rgb(3, 3, 65);
        }
    </style>
</head>
<body>

    <a href="/">Загрузить файлы</a>
    
    <h1>Все файлы</h1>
    <div class="files">
    </div>

    <script>
        const getFiles = async () => {
            const res = await fetch('/files');
            const data = await res.json();
            const filesList = data.files;
            console.log(data);

            filesList.forEach(file => {
                const fileDiv = document.createElement('div');
                fileDiv.classList.add('file');

                const fileName = document.createElement('h2');
                fileName.textContent = file.name;

                const fileUrl = document.createElement('a');
                fileUrl.textContent = 'Скачать файл';
                fileUrl.href = file.url;

                fileDiv.append(fileName);
                fileDiv.append(fileUrl);
                document.querySelector('.files').append(fileDiv);
            });
        }

        document.addEventListener("DOMContentLoaded", () => getFiles());
    </script>

</body>
</html>
